<!doctype html>
<!-- Source for assets/og.png (1200x630). Regenerate:
     chrome --headless --window-size=1200,630 --screenshot=assets/og.png --hide-scrollbars og/og.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: #050505; overflow: hidden; }
  body {
    position: relative;
    font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    color: #ededed;
    display: flex; align-items: center; gap: 72px;
    padding: 0 88px;
    background:
      radial-gradient(520px 520px at 250px 315px, rgba(244,88,106,.20), transparent 70%),
      radial-gradient(900px 500px at 1200px 700px, rgba(244,88,106,.06), transparent 70%),
      #050505;
  }
  /* faint grid, like a weight matrix */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(#ffffff08 1px, transparent 1px),
      linear-gradient(90deg, #ffffff08 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse at 30% 50%, #000 0%, transparent 75%);
            mask-image: radial-gradient(ellipse at 30% 50%, #000 0%, transparent 75%);
  }
  .logo { position: relative; width: 340px; height: 340px; flex: none; filter: drop-shadow(0 0 40px rgba(244,88,106,.35)); }
  .logo img { width: 100%; height: 100%; display: block; }
  .text { position: relative; }
  h1 {
    font-size: 132px; line-height: 1; font-weight: 800; letter-spacing: 6px; color: #fff;
    margin-bottom: 34px;
  }
  .acro { list-style: none; padding: 0; }
  .acro li {
    font-size: 33px; line-height: 1.32; color: #8a8a8a; font-weight: 400; letter-spacing: .2px;
    white-space: nowrap;
  }
  .acro b { color: #f4586a; font-weight: 800; font-size: 40px; display: inline-block;  }
  .acro li:not(:first-child) { }
  .acro span { color: #ededed; }
  .tag {
    position: absolute; right: 88px; bottom: 44px;
    font-size: 22px; color: #555; letter-spacing: .5px;
  }
  .tag i { color: #f4586a; font-style: normal; }
</style>
</head>
<body>
  <div class="logo"><img src="../assets/walrus.png" alt=""></div>
  <div class="text">
    <h1>WALRUS</h1>
    <ul class="acro">
      <li><b>W</b><span>eight</span> <b>A</b><span>nd</span> <b style="width:auto">L</b><span>iberty</span>-based</li>
      <li><b>R</b><span>ecommendation</span></li>
      <li><b>U</b><span>tility</span> <b>S</b><span>ystem</span></li>
    </ul>
  </div>
  <div class="tag">Recommendations your users can <i>tune</i></div>
</body>
</html>
